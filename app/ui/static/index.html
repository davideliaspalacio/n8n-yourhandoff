<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff Flows</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<style>
:root { --ok:var(--bs-success); --bad:var(--bs-danger); --run:var(--bs-warning); }
body { background:var(--bs-tertiary-bg); }
.navbar { background:var(--bs-body-bg); border-bottom:1px solid var(--bs-border-color); }
.navbar-brand { font-weight:700; letter-spacing:-.01em; }
.navbar-brand .dot { display:inline-block; width:.6rem; height:.6rem; border-radius:50%;
  background:var(--bs-primary); margin-right:.5rem; }
main { padding-top:1.5rem; padding-bottom:3rem; }
h2.page-title { font-size:1.5rem; font-weight:700; letter-spacing:-.01em; }
.card { border-color:var(--bs-border-color); }
.card-header { font-weight:600; background:var(--bs-body-bg); }
.table > :not(caption) > * > * { padding:.7rem .9rem; }
.table thead th { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
  color:var(--bs-secondary-color); font-weight:600; background:var(--bs-body-bg); }
.card > .table-responsive > .table, .card > .table { margin-bottom:0; }
tr.link { cursor:pointer; }
.stat-label { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
  color:var(--bs-secondary-color); font-weight:600; }
.stat-value { font-size:1.5rem; font-weight:700; line-height:1.2; }
.empty { text-align:center; padding:2.5rem 1rem; color:var(--bs-secondary-color); }
pre { background:var(--bs-tertiary-bg); border:1px solid var(--bs-border-color);
  border-radius:var(--bs-border-radius); padding:.75rem; overflow:auto; font-size:.8rem;
  max-height:22rem; margin:0; }
/* pipeline */
.pipe { display:flex; flex-wrap:wrap; align-items:center; gap:.6rem .25rem; padding:.25rem 0; }
.node { display:inline-flex; align-items:center; gap:.5rem; padding:.55rem .9rem;
  background:var(--bs-body-bg); color:var(--bs-body-color); font:inherit; font-weight:500;
  border:2px solid var(--bs-warning); border-radius:.75rem; cursor:pointer;
  transition:box-shadow .15s, transform .15s; }
.node:hover { box-shadow:0 .25rem .75rem rgba(0,0,0,.15); transform:translateY(-1px); }
.node.succeeded { border-color:var(--bs-success); } .node.failed { border-color:var(--bs-danger); }
.node.sel { box-shadow:0 0 0 .25rem rgba(var(--bs-primary-rgb), .25); }
.node .ico { display:inline-flex; align-items:center; justify-content:center; width:1.4rem;
  height:1.4rem; border-radius:50%; font-size:.8rem; font-weight:700; color:#fff;
  background:var(--bs-warning); }
.node.succeeded .ico { background:var(--bs-success); } .node.failed .ico { background:var(--bs-danger); }
.arrow { display:inline-flex; align-items:center; width:1.6rem; color:var(--bs-secondary-color);
  justify-content:center; }
.pipe-detail { background:var(--bs-body-bg); border:1px solid var(--bs-border-color);
  border-radius:var(--bs-border-radius); padding:.9rem 1rem; margin:.75rem 0 0;
  box-shadow:var(--bs-box-shadow-sm); }
.pipe-detail pre { margin:.6rem 0 0; }
@media (max-width:575.98px) { .arrow { transform:none; width:1rem; } }
</style>
</head>
<body>
<nav class="navbar navbar-expand-sm">
  <div class="container-xxl gap-2">
    <span class="navbar-brand mb-0 me-3"><span class="dot"></span>Handoff Flows</span>
    <ul class="nav nav-pills flex-row" id="tabs">
      <li class="nav-item"><a class="nav-link" href="#/flows" data-tab="flows">Flows</a></li>
      <li class="nav-item"><a class="nav-link" href="#/runs" data-tab="runs">Runs</a></li>
      <li class="nav-item"><a class="nav-link" href="#/costs" data-tab="costs">Costs</a></li>
    </ul>
    <button id="key-btn" type="button" class="btn btn-sm btn-outline-secondary ms-auto"></button>
  </div>
</nav>
<main id="view" class="container-xxl">Loading…</main>
<script>
const setTheme = () => document.documentElement.setAttribute('data-bs-theme',
  matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTheme);
const view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => '$' + Number(v || 0).toFixed(4);
const when = iso => iso ? new Date(iso).toLocaleString() : '—';

function getKey() { try { return localStorage.getItem('apiKey') || ''; } catch { return ''; } }
function askKey(msg) {
  const k = prompt(msg || 'API key (sent as X-API-Key):', getKey());
  if (k !== null) { try { localStorage.setItem('apiKey', k.trim()); } catch {} render(); }
}
async function api(path, opts = {}) {
  if (!getKey()) { askKey(); if (!getKey()) throw new Error('API key required'); }
  const r = await fetch(path, { ...opts, headers: { 'X-API-Key': getKey(), ...(opts.headers || {}) } });
  if (r.status === 401) { askKey('Invalid key. API key:'); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

const badgeCls = s => s === 'succeeded' ? 'text-bg-success' : s === 'failed' ? 'text-bg-danger'
  : s === 'running' ? 'text-bg-warning' : 'text-bg-secondary';
const statusCell = (s, big) => `<span class="badge ${badgeCls(s)}${big ? ' fs-6' : ''}">${esc(s)}</span>`;
const empty = html => `<div class="empty">${html}</div>`;
const pill = t => `<span class="badge rounded-pill text-bg-light border">${esc(t)}</span>`;

// n8n-style pipeline: connected nodes, click a node to toggle its detail panel.
// Steps are kept in a registry so onclick only passes small numeric ids.
const pipes = [];
function pipelineHtml(steps) {
  steps = steps || [];
  if (!steps.length) return empty('No steps recorded.');
  const pid = pipes.push(steps) - 1;
  const cls = s => s === 'succeeded' || s === 'failed' ? s : 'other';
  const ico = s => s === 'succeeded' ? '✓' : s === 'failed' ? '✗' : '●';
  return `<div class="pipe" id="pipe-${pid}">` + steps.map((s, i) =>
    (i ? '<span class="arrow">&#10230;</span>' : '') +
    `<button type="button" class="node ${cls(s.status)}" onclick="showStep(${pid}, ${i})"
       title="${esc(s.status)}"><span class="ico">${ico(s.status)}</span>
       <span>${esc(s.name)}</span></button>`).join('') +
    `</div><div class="pipe-detail" id="pipe-detail-${pid}" hidden></div>`;
}
function showStep(pid, i) {
  const box = document.getElementById('pipe-detail-' + pid);
  const nodes = document.querySelectorAll(`#pipe-${pid} .node`);
  const s = pipes[pid][i];
  const same = box.dataset.sel === String(i) && !box.hidden;
  nodes.forEach((n, j) => n.classList.toggle('sel', !same && j === i));
  box.dataset.sel = String(i);
  box.hidden = same;
  if (same) return;
  box.innerHTML = `<div class="d-flex align-items-center gap-2"><strong>${esc(s.name)}</strong>
    ${statusCell(s.status)}
    <span class="text-body-secondary small">· ${when(s.at)}</span></div>` +
    (s.detail ? `<pre>${esc(JSON.stringify(s.detail, null, 2))}</pre>`
              : '<div class="text-body-secondary small mt-2">No detail.</div>');
}

async function renderFlows() {
  const { flows } = await api('/v1/flows');
  view.innerHTML = `<h2 class="page-title mb-3">Flows <span class="text-body-secondary fw-normal">(${flows.length})</span></h2>
  <div class="card shadow-sm">` + (flows.length ? `<div class="table-responsive"><table class="table table-hover align-middle">
  <thead><tr><th>Flow</th><th>Mode</th><th>Replaces (n8n)</th><th>Last run</th>
  <th class="text-end">Runs 7d</th><th class="text-end">OK 7d</th><th class="text-end">Cost 7d</th></tr></thead><tbody>` + flows.map(f => `
  <tr class="link" onclick="location.hash='#/flows/${encodeURIComponent(f.slug)}'">
    <td><strong>${esc(f.title)}</strong>
        <a href="#/runs?flow=${encodeURIComponent(f.slug)}" class="small ms-1 link-secondary"
           onclick="event.stopPropagation()">runs</a>
        <div class="small text-body-secondary font-monospace">${esc(f.endpoint)}</div></td>
    <td><span class="badge text-bg-secondary">${esc(f.mode)}</span></td>
    <td class="text-body-secondary">${esc(f.replaces)}</td>
    <td>${f.stats.last_status ? statusCell(f.stats.last_status) + ' ' : ''}
        <span class="small text-body-secondary">${when(f.stats.last_run_at)}</span></td>
    <td class="font-monospace text-end">${f.stats.runs}</td>
    <td class="font-monospace text-end">${f.stats.succeeded}</td>
    <td class="font-monospace text-end">${money(f.stats.cost_usd)}</td>
  </tr>`).join('') + '</tbody></table></div>' : empty('No flows registered.')) + '</div>';
}

async function renderFlow(slug) {
  const { flows } = await api('/v1/flows');
  const f = flows.find(x => x.slug === slug);
  if (!f) throw new Error('Unknown flow: ' + slug);
  const [ok, bad] = await Promise.all([
    api('/v1/runs?' + new URLSearchParams({ flow: slug, status: 'succeeded', per_page: 1 })),
    api('/v1/runs?' + new URLSearchParams({ flow: slug, status: 'failed', per_page: 1 })),
  ]);
  const last = ok.items[0] ? await api('/v1/runs/' + ok.items[0].id) : null;
  const runsLink = `#/runs?flow=${encodeURIComponent(slug)}`;
  const failedLink = `#/runs?${new URLSearchParams({ flow: slug, status: 'failed' })}`;
  const stat = (label, value) => `<div class="col-6 col-md-3"><div class="card shadow-sm h-100">
    <div class="card-body"><div class="stat-label">${label}</div>${value}</div></div></div>`;
  view.innerHTML = `<a href="#/flows" class="small link-secondary text-decoration-none">← flows</a>
  <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mt-2 mb-3">
    <div>
      <h2 class="page-title mb-1">${esc(f.title)}
        <span class="badge text-bg-secondary align-middle fs-6">${esc(f.mode)}</span>
        <span class="badge text-bg-light border align-middle fs-6 font-monospace">${esc(f.slug)}</span></h2>
      <div class="text-body-secondary"><span class="font-monospace">${esc(f.endpoint)}</span>
        · Replaces (n8n): ${esc(f.replaces)}</div>
    </div>
    <a class="btn btn-outline-primary btn-sm" href="${runsLink}">View runs</a>
  </div>
  <div class="row g-3 mb-4">
    ${stat('Runs 7d', `<div class="stat-value">${f.stats.runs}</div>`)}
    ${stat('OK 7d', `<div class="stat-value">${f.stats.succeeded}</div>`)}
    ${stat('Cost 7d', `<div class="stat-value font-monospace">${money(f.stats.cost_usd)}</div>`)}
    ${stat('Last run', `<div class="mt-1">${f.stats.last_status ? statusCell(f.stats.last_status) : '<span class="text-body-secondary">—</span>'}</div>
      <div class="small text-body-secondary mt-1">${when(f.stats.last_run_at)}</div>`)}
  </div>
  <div class="card shadow-sm">
    <div class="card-header d-flex flex-wrap justify-content-between gap-2">
      <span>Process</span>
      <span class="small fw-normal text-body-secondary">${last
        ? `from the latest successful run <a href="#/runs/${esc(last.id)}">${when(last.created_at)}</a>`
        : ''}</span>
    </div>
    <div class="card-body">${last ? pipelineHtml(last.steps)
      : empty(`No successful runs yet — the process will appear after the first run.${
          bad.total ? `<div class="mt-2"><a href="${failedLink}">View failed runs</a></div>` : ''}`)}</div>
  </div>`;
}

async function renderRuns(params) {
  const flow = params.get('flow') || '', status = params.get('status') || '';
  const page = Number(params.get('page') || 1);
  const q = new URLSearchParams({ page, per_page: 50 });
  if (flow) q.set('flow', flow); if (status) q.set('status', status);
  const data = await api('/v1/runs?' + q);
  const pages = Math.max(1, Math.ceil(data.total / data.per_page));
  const nav = (p, label) => `<button type="button" class="btn btn-outline-secondary" onclick="location.hash='#/runs?${
    new URLSearchParams({ ...(flow && { flow }), ...(status && { status }), page: p })}'">${label}</button>`;
  view.innerHTML = `<h2 class="page-title mb-3">Runs <span class="text-body-secondary fw-normal">(${data.total})</span></h2>
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <input id="f-flow" class="form-control form-control-sm w-auto" placeholder="flow slug" value="${esc(flow)}">
    <select id="f-status" class="form-select form-select-sm w-auto">
      ${['', 'running', 'succeeded', 'failed'].map(s =>
        `<option value="${s}" ${s === status ? 'selected' : ''}>${s || 'any status'}</option>`).join('')}
    </select>
    <button class="btn btn-primary btn-sm" id="f-go">Filter</button>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="small text-body-secondary">page ${data.page}/${pages}</span>
      <div class="btn-group btn-group-sm">
        ${data.page > 1 ? nav(data.page - 1, '←') : ''}${data.page < pages ? nav(data.page + 1, '→') : ''}
      </div>
    </div>
  </div>
  <div class="card shadow-sm">` + (data.items.length ? `<div class="table-responsive"><table class="table table-hover align-middle">
  <thead><tr><th>When</th><th>Flow</th><th>Status</th><th>Error</th></tr></thead><tbody>` +
  data.items.map(r => `
  <tr class="link" onclick="location.hash='#/runs/${r.id}'">
    <td>${when(r.created_at)}${r.replay_of ? ' ' + pill('replay') : ''}${
      r.dry_run ? ' ' + pill('dry run') : ''}</td>
    <td>${esc(r.flow)}</td><td>${statusCell(r.status)}</td>
    <td class="text-danger small">${esc((r.error || '').slice(0, 90))}</td>
  </tr>`).join('') + '</tbody></table></div>' : empty('No runs match these filters.')) + '</div>';
  document.getElementById('f-go').onclick = () => {
    const q = new URLSearchParams();
    const f = document.getElementById('f-flow').value.trim();
    const s = document.getElementById('f-status').value;
    if (f) q.set('flow', f); if (s) q.set('status', s);
    location.hash = '#/runs?' + q;
  };
}

async function renderRun(id) {
  const run = await api('/v1/runs/' + id);
  const section = (title, body) => `<div class="card shadow-sm mb-3">
    <div class="card-header">${title}</div><div class="card-body">${body}</div></div>`;
  const costs = (run.costs || []).length
    ? '<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Provider</th><th>Operation</th><th class="text-end">Units</th><th class="text-end">USD</th></tr></thead><tbody>' +
      run.costs.map(c => `<tr><td>${esc(c.provider)}</td><td>${esc(c.operation)}</td>
        <td class="font-monospace text-end">${c.units}</td>
        <td class="font-monospace text-end">${money(c.cost_usd)}</td></tr>`).join('') + '</tbody></table></div>'
    : empty('No paid calls.');
  view.innerHTML = `<a href="#/runs" class="small link-secondary text-decoration-none">← runs</a>
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-2 mb-1">
    <h2 class="page-title mb-0">${esc(run.flow)} ${statusCell(run.status, true)}</h2>
    <button class="btn btn-primary" id="replay">Replay with same input</button>
  </div>
  <p class="text-body-secondary mb-3">run <span class="font-monospace">${esc(run.id)}</span> · ${when(run.created_at)} → ${when(run.finished_at)}
    · cost ${money(run.total_cost_usd)}
    ${run.replay_of ? `· replay of <a href="#/runs/${esc(run.replay_of)}">original</a>` : ''}
    ${run.dry_run ? '· ' + pill('dry run') : ''}</p>
  ${run.error ? `<div class="alert alert-danger">${esc(run.error)}</div>` : ''}
  ${section('Steps', pipelineHtml(run.steps))}
  ${section('Costs', costs)}
  ${section('Input', `<pre>${esc(JSON.stringify(run.input, null, 2))}</pre>`)}
  ${section('Output', `<pre>${esc(JSON.stringify(run.output, null, 2))}</pre>`)}`;
  document.getElementById('replay').onclick = async () => {
    if (!confirm('Re-run this flow with the same input?')) return;
    try {
      const r = await api(`/v1/runs/${id}/replay`, { method: 'POST' });
      location.hash = '#/runs/' + r.run_id;
    } catch (e) { alert('Replay failed: ' + e.message); }
  };
}

async function renderCosts() {
  const [byDay, byProvider] = await Promise.all([
    api('/v1/costs/summary?group_by=day&days=30'),
    api('/v1/costs/summary?group_by=provider&days=30'),
  ]);
  const table = (items, col) => items.length
    ? `<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>${col}</th><th class="text-end">USD</th></tr></thead><tbody>` + items.map(i =>
        `<tr><td>${esc(i[col.toLowerCase()])}</td><td class="font-monospace text-end">${money(i.cost_usd)}</td></tr>`).join('') + '</tbody></table></div>'
    : empty('No costs in the last 30 days.');
  const card = (title, body) => `<div class="card shadow-sm mb-3">
    <div class="card-header">${title}</div>${body}</div>`;
  view.innerHTML = `<h2 class="page-title mb-3">Costs <span class="text-body-secondary fw-normal">— last 30 days</span></h2>
    ${card('By provider', table(byProvider.items, 'Provider'))}
    ${card('By day', table(byDay.items, 'Day'))}`;
}

async function render() {
  const hash = location.hash || '#/flows';
  const [path, query] = hash.slice(2).split('?');
  const params = new URLSearchParams(query || '');
  const tab = path.split('/')[0] || 'flows';
  document.querySelectorAll('#tabs a').forEach(a =>
    a.classList.toggle('active', a.dataset.tab === tab));
  document.getElementById('key-btn').textContent = getKey() ? 'API key ✓' : 'Set API key';
  view.innerHTML = empty('Loading…');
  try {
    if (path.startsWith('runs/')) await renderRun(path.split('/')[1]);
    else if (path.startsWith('flows/')) await renderFlow(decodeURIComponent(path.split('/')[1]));
    else if (tab === 'runs') await renderRuns(params);
    else if (tab === 'costs') await renderCosts();
    else await renderFlows();
  } catch (e) {
    view.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}
document.getElementById('key-btn').onclick = () => askKey();
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
